<!doctype html>
<!-- tools/prop-preview.html?m=a.glb,b.glb — each model in a row, seen from its front (+z), right, back and left, all
     scaled to one height: for checking a prop's look, simplification and which way it faces before placing it -->
<html><head><meta charset="utf-8"><title>Prop preview</title>
<style>html,body{margin:0;background:#9aa3ad;overflow:hidden}#l{position:fixed;left:8px;top:6px;font:13px monospace;color:#111;white-space:pre}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/gh/mrdoob/three.js@e27dfa95ae7f453b5d7a9a36ffdb563f7c9b529b/build/three.webgpu.js","three/webgpu":"https://cdn.jsdelivr.net/gh/mrdoob/three.js@e27dfa95ae7f453b5d7a9a36ffdb563f7c9b529b/build/three.webgpu.js","three/tsl":"https://cdn.jsdelivr.net/gh/mrdoob/three.js@e27dfa95ae7f453b5d7a9a36ffdb563f7c9b529b/build/three.tsl.js","three/addons/":"https://cdn.jsdelivr.net/gh/mrdoob/three.js@e27dfa95ae7f453b5d7a9a36ffdb563f7c9b529b/examples/jsm/"}}</script>
</head><body><div id="l"></div><script type="module">
import * as THREE from 'three/webgpu';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
const files = (new URLSearchParams(location.search).get('m') || '').split(',').filter(Boolean);
const renderer = new THREE.WebGPURenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
await renderer.init();
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0x667788, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(3, 6, 5);
scene.add(sun);
const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
const W = 1.3; // column spacing (model height = 1)
const label = [];
for (const [row, f] of files.entries()) {
  const g = (await loader.loadAsync(f)).scene;
  const box = new THREE.Box3().setFromObject(g);
  const size = box.getSize(new THREE.Vector3());
  const s = 1 / size.y;
  let tris = 0;
  g.traverse((o) => { if (o.isMesh) tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; });
  label.push(`${row}: ${f.split('/').pop()}  ${Math.round(tris)} tris  ${size.x.toFixed(3)} x ${size.y.toFixed(3)} x ${size.z.toFixed(3)}`);
  for (let k = 0; k < 4; k++) {
    const c = g.clone();
    const wrap = new THREE.Group();
    c.scale.setScalar(s);
    c.position.set(-(box.min.x + box.max.x) / 2 * s, -box.min.y * s, -(box.min.z + box.max.z) / 2 * s);
    wrap.add(c);
    wrap.rotation.y = -k * Math.PI / 2; // front, right side, back, left side
    wrap.position.set((k - 1.5) * W * Math.max(1, size.x / size.y), -row * 1.5, 0);
    scene.add(wrap);
  }
}
document.getElementById('l').textContent = 'columns: front (+z), right, back, left\n' + label.join('\n');
const n = Math.max(1, files.length);
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 200);
const span = Math.max(4 * W, n * 1.5 * 1.8);
camera.position.set(0, -(n - 1) * 0.75 + 1.2, span * 1.6);
camera.lookAt(0, -(n - 1) * 0.75 + 0.4, 0);
renderer.setAnimationLoop(() => renderer.render(scene, camera));
window.__ready = true;
</script></body></html>
